# Deploys the resume site to Vercel via the Vercel CLI.
#
# Why the CLI instead of Vercel's Git integration: the integration needs the Vercel GitHub
# App, an account-level install. The CLI path only needs a personal access token, and it is
# the same approach used by the WarehouseJobs.com deploy workflows.
#
#   pull request  -> validate, then deploy a preview and comment the URL
#   push to main  -> validate, then deploy to production
#   manual run    -> validate, then deploy to production
#
# Configuration lives in the PRODUCTION GitHub Environment (Settings -> Environments ->
# PRODUCTION), and the deploy job below opts in with `environment: PRODUCTION`:
#   secret    VERCEL_TOKEN        Vercel -> Account Settings -> Tokens -> Create Token
#   variable  VERCEL_ORG_ID       "orgId" from .vercel/project.json after `vercel link`
#   variable  VERCEL_PROJECT_ID   "projectId" from the same file
# Pull request previews also run in this environment (same-repo branches only), so any
# required-reviewer or branch rule added to PRODUCTION will apply to them too.
name: Deploy Resume (Vercel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-resume-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate resume.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/validate.mjs
      - run: npm test
      - name: Page is up to date with src/template.html
        run: |
          cp index.html /tmp/index.committed.html
          node scripts/build.mjs
          # resume.json edits from the web editor do not rebuild index.html; only the embedded
          # fallback copy of the data may differ, so compare with it removed.
          strip() { sed -E 's#<script type="application/json" id="seed">.*</script>#<seed/>#' "$1"; }
          diff -q <(strip /tmp/index.committed.html) <(strip index.html) || { echo "::error::index.html is stale. Run node scripts/build.mjs and commit it."; exit 1; }

  deploy:
    name: Deploy
    needs: validate
    environment: PRODUCTION
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks, so only deploy previews for
    # branches in this repository.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          [[ -z "$VERCEL_TOKEN" ]] && { echo "::error::Secret VERCEL_TOKEN is not set."; missing=1; }
          [[ -z "$VERCEL_ORG_ID" ]] && { echo "::error::Variable VERCEL_ORG_ID is not set."; missing=1; }
          [[ -z "$VERCEL_PROJECT_ID" ]] && { echo "::error::Variable VERCEL_PROJECT_ID is not set."; missing=1; }
          exit $missing

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Word and PDF are generated from resume.json on every deploy and served from /downloads,
      # so the site's Export buttons and any uploaded copy always match the page. Chrome (for the
      # PDF) is preinstalled on ubuntu runners.
      - name: Build resume downloads (Word + PDF)
        run: |
          node scripts/export.mjs
          ls -la downloads

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Set deploy target
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          else
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build project artifacts
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt artifacts
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Smoke check
        run: |
          for attempt in $(seq 1 6); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/resume.json" || echo "000")
            if [[ "$status" == "200" ]]; then
              echo "resume.json reachable (HTTP $status) on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt/6 returned HTTP $status, retrying in 10s..."
            sleep 10
          done
          echo "::warning::${{ steps.deploy.outputs.url }}/resume.json did not return HTTP 200. Vercel deployment protection may be on; check the project's Settings -> Deployment Protection."

      - name: Comment preview URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${{ steps.deploy.outputs.url }}`,
            });
